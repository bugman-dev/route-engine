services:
  route-engine:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Inside the compose network, OSRM is reached by service name (not localhost).
      OSRM_BASE_URL: http://osrm:5000
    depends_on:
      - osrm
    restart: unless-stopped

  osrm:
    # Pin the image version for reproducible deploys.
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    command: >
      osrm-routed --algorithm mld --max-table-size 10000
      /data/${OSRM_MAP}.osrm
    volumes:
      - ./osrm-data:/data
    restart: unless-stopped
    # OSRM stays private on the compose network.
    # Uncomment to debug from the host:
    # ports:
    #   - "5000:5000"
