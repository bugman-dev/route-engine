[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "route-engine"
version = "0.1.0"
description = "Generic multi-vehicle route generation engine (CVRP)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "ortools>=9.11",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
route-engine-api = "route_engine.api.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
